[theme]
base = "light"
primaryColor = "#286356"
backgroundColor = "#f7f7f2"
secondaryBackgroundColor = "#ffffff"
textColor = "#23352f"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"
