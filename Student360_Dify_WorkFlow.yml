      - id: report_prepare
        type: custom
        width: 260
        height: 150
        position:
          x: 6140
          y: 80
        positionAbsolute:
          x: 6140
          y: 80
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          type: code
          title: Prepare your preferred report language
          desc: The language choice only affects the final report. The original answer, review decision and approved
            wording stay in the review record.
          selected: false
          code: |
            import json
            import re

            def main(result: dict, report_language: str) -> dict:
                selected = (report_language or 'English').strip()
                code = 'zh-Hant' if selected == 'Chinese (Traditional) 繁體中文' else (
                    'zh-Hans' if selected == 'Chinese (Simplified) 简体中文' else 'en'
                )
                name = {'en': 'English', 'zh-Hans': '简体中文', 'zh-Hant': '繁體中文'}[code]
                content = {key: str(result.get(key) or '') for key in ('answer', 'missing_information', 'staff_evidence')}
                content['translation_status'] = 'not_requested'
                content['notice'] = ''
                route = result.get('route', '')
                # Unrecognized students remain a local response: no retrieval or model call, even in Chinese.
                if code != 'en' and route in ('student_not_found', 'clarification_required'):
                    student = str(result.get('student_alias') or '')
                    if route == 'clarification_required':
                        content['answer'] = ('请每次只询问一位学生：Taylor、Riley 或 Skyler。' if code == 'zh-Hans'
                                             else '請每次只詢問一位學生：Taylor、Riley 或 Skyler。')
                    elif code == 'zh-Hans':
                        content['answer'] = (('未找到 ' + student + ' 的学生记录。') if student else '请在问题中注明学生姓名。')
                        content['answer'] += '目前可查询的学生记录为 Taylor、Riley 和 Skyler。请核对姓名，或联系学校确认学生记录。'
                    else:
                        content['answer'] = (('未找到 ' + student + ' 的學生記錄。') if student else '請在問題中註明學生姓名。')
                        content['answer'] += '目前可查詢的學生記錄為 Taylor、Riley 和 Skyler。請核對姓名，或聯絡學校確認學生記錄。'
                    content['missing_information'] = ('学生记录或明确的学生姓名。' if code == 'zh-Hans'
                                                       else '學生記錄或明確的學生姓名。')
                    content['translation_status'] = 'localized'

                needs_translation = code != 'en' and content['translation_status'] != 'localized'
                protected = {}
                payload = {}
                names = ['Taylor', 'Riley', 'Skyler']
                student = str(result.get('student_alias') or '')
                if student and student not in names:
                    names.append(student)
                name_pattern = r'\b(?:' + '|'.join(re.escape(item) for item in names) + r')\b'
                pattern = re.compile(
                    r'\[[^\]\n]{1,200}\]|https?://[^\s)]+|' + name_pattern +
                    r'|\b(?:IELTS|TOEFL|PET|KET|CEFR|[ABC][12])\b|\d+(?:[.,:/-]\d+)*(?:%)?', re.I
                )
                def letters(number):
                    label = ''
                    while True:
                        label = chr(65 + number % 26) + label
                        number = number // 26 - 1
                        if number < 0:
                            return label
                def protect(match):
                    token = 'ZXQ' + letters(len(protected)) + 'QXZ'
                    while any(token in value for value in content.values()):
                        token = 'ZXQX' + token + 'XQXZ'
                    protected[token] = match.group(0)
                    return token
                for key in ('answer', 'missing_information', 'staff_evidence'):
                    payload[key] = pattern.sub(protect, content[key])
                return {'requires_translation': 'yes' if needs_translation else 'no',
                        'language_code': code, 'language_name': name, 'content': content,
                        'translation_payload': json.dumps(payload, ensure_ascii=False),
                        'protected_values': json.dumps(protected, ensure_ascii=False)}
          code_language: python3
          variables:
            - variable: result
              value_selector:
                - final_aggregate
                - output
            - variable: report_language
              value_selector:
                - start
                - report_language
          outputs:
            requires_translation:
              type: string
              children: null
            language_code:
              type: string
              children: null
            language_name:
              type: string
              children: null
            content:
              type: object
              children: null
            translation_payload:
              type: string
              children: null
            protected_values:
              type: string
              children: null
          version: '1'
      - id: report_language_gate
        type: custom
