      - id: report_translation_check
        type: custom
        width: 260
        height: 150
        position:
          x: 7100
          y: 80
        positionAbsolute:
          x: 7100
          y: 80
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          type: code
          title: Check the translated report
          desc: Restore protected student names, numbers and source references. Show the original with a clear notice
            if translation fails validation.
          selected: false
          code: |
            import json
            import re
            from collections import Counter

            def main(raw: str, translation_payload: str, protected_values: str, content: dict, language_code: str) -> dict:
                original = dict(content)
                def fallback():
                    original['translation_status'] = 'unavailable'
                    original['notice'] = (
                        '暂时无法完成可靠的中文翻译，以下显示原文。请稍后重试；原有审核结果不变。'
                        if language_code == 'zh-Hans' else
                        '暫時無法完成可靠的中文翻譯，以下顯示原文。請稍後重試；原有審核結果不變。'
                    )
                    return {'content': original}
                try:
                    source = json.loads(translation_payload)
                    protected = json.loads(protected_values)
                    text = (raw or '').strip().lstrip('\ufeff')
                    if text.startswith('```'):
                        text = re.sub(r'^```(?:json)?\s*', '', text, flags=re.I)
                        text = re.sub(r'\s*```$', '', text)
                    translated = json.loads(text)
                    keys = {'answer', 'missing_information', 'staff_evidence'}
                    if not isinstance(translated, dict) or set(translated) != keys:
                        return fallback()
                    token_pattern = r'ZXQ[A-Z]+?QXZ'
                    for key in keys:
                        value = translated[key]
                        if not isinstance(value, str) or (bool(source[key].strip()) != bool(value.strip())):
                            return fallback()
                        if Counter(re.findall(token_pattern, source[key])) != Counter(re.findall(token_pattern, value)):
                            return fallback()
                        if re.search(r'\d', value):
                            return fallback()
                        # Nonempty English prose must have actually been translated.
                        unprotected = re.sub(token_pattern, '', source[key])
                        if re.search(r'[A-Za-z]{2}', unprotected) and not re.search(r'[\u3400-\u9fff]', value):
                            return fallback()
                        for token, literal in protected.items():
                            value = value.replace(token, literal)
                        translated[key] = value
                    translated['translation_status'] = 'translated'
                    translated['notice'] = ''
                    return {'content': translated}
                except (ValueError, TypeError, KeyError):
                    return fallback()
          code_language: python3
          variables:
            - variable: raw
              value_selector:
                - report_translate
                - text
            - variable: translation_payload
              value_selector:
                - report_prepare
                - translation_payload
            - variable: protected_values
              value_selector:
                - report_prepare
                - protected_values
            - variable: content
              value_selector:
                - report_prepare
                - content
            - variable: language_code
              value_selector:
                - report_prepare
                - language_code
          outputs:
            content:
              type: object
              children: null
          version: '1'
