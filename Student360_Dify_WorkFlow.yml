      - id: report_format
        type: custom
        width: 260
        height: 150
        position:
          x: 7740
          y: 80
        positionAbsolute:
          x: 7740
          y: 80
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          type: code
          title: Create your Student Progress Report
          desc: One readable report for parents, with localized status labels and original source references. Internal
            audit fields remain in the workflow record.
          selected: false
          code: |
            def main(result: dict, content: dict, language_code: str, language_name: str) -> dict:
                en = {
                    'report':'Student Progress Report', 'student':'Student', 'student_unknown':'Please confirm the student name',
                    'outcome':'Request outcome', 'evidence':'Supporting information', 'review':'Review status',
                    'language':'Report language', 'changes':'Review updates', 'answer':'Your answer', 'approved_plan':'Teacher-approved plan',
                    'translated_plan':'Teacher-approved plan (Chinese translation)',
                    'missing':'Information still needed', 'staff':'School-verified information', 'sources':'Sources',
                    'no_sources':'No matching sources are available for this response.',
                    'translation_note':'This is a translation of the reviewed original. The original wording remains in the review record.',
                }
                hans = {
                    'report':'学生进度报告', 'student':'学生', 'student_unknown':'请确认学生姓名',
                    'outcome':'处理结果', 'evidence':'支持信息', 'review':'审核状态', 'language':'报告语言',
                    'changes':'审核调整', 'answer':'您的答复', 'approved_plan':'教师批准的计划', 'translated_plan':'教师批准的计划（中文翻译）',
                    'missing':'仍需补充的信息', 'staff':'学校核实的信息', 'sources':'参考来源',
                    'no_sources':'本次答复暂无匹配的参考来源。',
                    'translation_note':'本中文内容为已审阅原文的翻译，原始措辞已保留在审核记录中。',
                }
                hant = {
                    'report':'學生進度報告', 'student':'學生', 'student_unknown':'請確認學生姓名',
                    'outcome':'處理結果', 'evidence':'支持資訊', 'review':'審核狀態', 'language':'報告語言',
                    'changes':'審核調整', 'answer':'您的答覆', 'approved_plan':'教師批准的計劃', 'translated_plan':'教師批准的計劃（中文翻譯）',
                    'missing':'仍需補充的資訊', 'staff':'學校核實的資訊', 'sources':'參考來源',
                    'no_sources':'本次答覆暫無匹配的參考來源。',
                    'translation_note':'本中文內容為已審閱原文的翻譯，原始措辭已保留在審核記錄中。',
                }
                lang_index = {'en': 0, 'zh-Hans': 1, 'zh-Hant': 2}.get(language_code, 0)
                labels = (en, hans, hant)[lang_index]
                routes = {
                    'fully_automated': ('Progress answer ready', '进度答复已完成', '進度答覆已完成'),
                    'insufficient_evidence': ('School review', '学校审核', '學校審核'),
                    'teacher_review': ('Teacher review', '教师审核', '教師審核'),
                    'student_not_found': ('Student record not found', '未找到学生记录', '未找到學生記錄'),
                    'clarification_required': ('Student name clarification needed', '需要确认学生姓名', '需要確認學生姓名'),
                }
                evidence = {
                    'sufficient': ('Supported by available records', '现有记录提供支持', '現有記錄提供支持'),
                    'insufficient': ('More information needed', '需要更多信息', '需要更多資訊'),
                    'missing': ('Required information missing', '所需信息缺失', '所需資訊缺失'),
                    'missing_records': ('Student records not retrieved', '未检索到学生记录', '未檢索到學生記錄'),
                    'conflicting': ('Conflicting information needs checking', '信息存在冲突，需要核实', '資訊存在衝突，需要核實'),
                    'illegible': ('Recorded information is unreadable', '记录中的信息无法辨认', '記錄中的資訊無法辨認'),
                    'not_checked': ('No records checked', '尚未检查记录', '尚未檢查記錄'),
                    'staff_verified': ('Confirmed by school staff', '学校人员已核实', '學校人員已核實'),
                    'unverified': ('Supporting information needs verification', '支持信息有待核实', '支持資訊有待核實'),
                    'draft_validation_failed': ('Answer references need checking', '答复来源需要核实', '答覆來源需要核實'),
                }
                reviews = {
                    'not_required': ('No review required', '无需审核', '無需審核'),
                    'teacher_approved': ('Teacher approved', '教师已批准', '教師已批准'),
                    'not_approved': ('Plan not approved', '计划未获批准', '計劃未獲批准'),
                    'timed_out': ('Review not completed in time', '审核未在时限内完成', '審核未在時限內完成'),
                    'evidence_pending': ('Awaiting missing information', '等待补充信息', '等待補充資訊'),
                    'staff_confirmed': ('School staff confirmed the information', '学校人员已确认信息', '學校人員已確認資訊'),
                }
                changes = {
                    'teacher_edited': ('Teacher updated the plan', '教师已调整计划', '教師已調整計劃'),
                    'approved_unchanged': ('Teacher approved the original plan', '教师批准了原计划', '教師批准了原計劃'),
                    'staff_edited': ('School staff updated the response', '学校人员已更新答复', '學校人員已更新答覆'),
                }
                def readable(table, key, fallback):
                    return table.get(str(result.get(key) or ''), fallback)[lang_index]
                outcome = readable(routes, 'route', ('Response ready', '答复已完成', '答覆已完成'))
                support = readable(evidence, 'evidence_status', ('Supporting information needs checking', '支持信息需要核实', '支持資訊需要核實'))
                review = readable(reviews, 'review_status', ('Review status needs checking', '审核状态需要核实', '審核狀態需要核實'))
                student = str(result.get('student_alias') or labels['student_unknown'])
                lines = ['# Student 360', '## ' + labels['report'],
                         '**' + labels['student'] + ':** ' + student,
                         '**' + labels['outcome'] + ':** ' + outcome,
                         '**' + labels['evidence'] + ':** ' + support,
                         '**' + labels['review'] + ':** ' + review,
                         '**' + labels['language'] + ':** ' + language_name]
                if result.get('change_status') in changes:
                    lines.append('**' + labels['changes'] + ':** ' + changes[result['change_status']][lang_index])
                if content.get('notice'):
                    lines.append('> ' + content['notice'])
                heading = labels['answer']
                if result.get('review_status') == 'teacher_approved':
                    heading = labels['translated_plan'] if content.get('translation_status') == 'translated' else labels['approved_plan']
                lines += ['### ' + heading, str(content.get('answer') or '')]
                if content.get('missing_information'):
                    lines += ['### ' + labels['missing'], content['missing_information']]
                if result.get('review_status') == 'staff_confirmed' and content.get('staff_evidence'):
                    lines += ['### ' + labels['staff'], content['staff_evidence']]
                lines += ['### ' + labels['sources'], str(result.get('sources') or labels['no_sources'])]
                if content.get('translation_status') == 'translated' and result.get('review_status') in ('teacher_approved', 'staff_confirmed'):
                    lines.append('> ' + labels['translation_note'])
                return {'student_progress_report': '\n\n'.join(lines)}
          code_language: python3
          variables:
            - variable: result
              value_selector:
                - final_aggregate
                - output
            - variable: content
              value_selector:
                - report_content
                - output
            - variable: language_code
              value_selector:
                - report_prepare
                - language_code
            - variable: language_name
              value_selector:
                - report_prepare
                - language_name
          outputs:
            student_progress_report:
              type: string
              children: null
          version: '1'
