        positionAbsolute:
          x: 3200
          y: 80
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          type: code
          title: Check answer references
          desc: ''
          selected: false
          code: |
            import re, json
            def main(raw: str, used_sources: str) -> dict:
                bad = {'draft_valid':'no','answer':'','sources':'',
                       'validation_message':'The generated answer was empty, malformed, or used unvalidated references. Staff review is required.'}
                try:
                    value=(raw or '').strip()
                    if value.startswith('```'):
                        value=re.sub(r'^```(?:json)?\s*','',value,flags=re.I)
                        value=re.sub(r'\s*```$','',value)
                    item=json.loads(value)
                    if not isinstance(item,dict): return bad
                    answer,citations=item.get('answer'),item.get('citations')
                    if not isinstance(answer,str) or not answer.strip() or len(answer)>16000: return bad
                    if not isinstance(citations,list) or not citations: return bad
                    allowed=re.findall(r'\[[^\]\n]+\]',used_sources)
                    if any(not isinstance(c,str) or c not in allowed or c not in answer for c in citations): return bad
                    actual=re.findall(r'\[(?:[A-Za-z]+-p\d+|Report: [^\]\n]+)\]',answer)
                    if any(c not in citations for c in actual): return bad
                    return {'draft_valid':'yes','answer':answer,'sources':' '.join(dict.fromkeys(citations)), 'validation_message':''}
                except (ValueError,TypeError): return bad
          code_language: python3
          variables:
            - variable: raw
              value_selector:
                - draft
                - text
            - variable: used_sources
              value_selector:
                - assessment_check
                - used_sources
