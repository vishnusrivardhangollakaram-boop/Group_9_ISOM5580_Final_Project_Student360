      data:
        type: code
        title: Prepare your preferred report language
        desc: The language choice only affects the final report. The original answer, review decision and approved wording
          stay in the review record.
        selected: false
        code: "import json\nimport re\n\ndef main(result: dict, report_language: str) -> dict:\n    selected = (report_language\
          \ or 'English').strip()\n    code = 'zh-Hant' if selected == 'Chinese (Traditional) 繁體中文' else (\n        'zh-Hans'\
          \ if selected == 'Chinese (Simplified) 简体中文' else 'en'\n    )\n    name = {'en': 'English', 'zh-Hans': '简体中文', 'zh-Hant':\
          \ '繁體中文'}[code]\n    content = {key: str(result.get(key) or '') for key in ('answer', 'missing_information', 'staff_evidence')}\n\
          \    content['staff_evidence'] = ''\n    content['translation_status'] = 'not_requested'\n    content['notice']\
          \ = ''\n    route = result.get('route', '')\n    # Unrecognized students remain a local response: no retrieval or\
          \ model call, even in Chinese.\n    if code != 'en' and route in ('student_not_found', 'clarification_required'):\n\
          \        student = str(result.get('student_alias') or '')\n        if route == 'clarification_required':\n     \
          \       content['answer'] = ('请每次只询问一位学生，并注明学生姓名。' if code == 'zh-Hans'\n                                 else '請每次只詢問一位學生，並註明學生姓名。')\n\
          \        elif code == 'zh-Hans':\n            content['answer'] = (('未找到 ' + student + ' 的学生记录。') if student else\
          \ '请在问题中注明学生姓名。')\n            content['answer'] += '请核对姓名，或联系学校确认学生记录。'\n        else:\n            content['answer']\
          \ = (('未找到 ' + student + ' 的學生記錄。') if student else '請在問題中註明學生姓名。')\n            content['answer'] += '請核對姓名，或聯絡學校確認學生記錄。'\n\
          \        content['missing_information'] = ('学生记录或明确的学生姓名。' if code == 'zh-Hans'\n                              \
          \             else '學生記錄或明確的學生姓名。')\n        content['translation_status'] = 'localized'\n\n    needs_translation\
          \ = code != 'en' and content['translation_status'] != 'localized'\n    protected = {}\n    payload = {}\n    names\
          \ = ['Taylor', 'Riley', 'Skyler']\n    student = str(result.get('student_alias') or '')\n    if student and student\
          \ not in names:\n        names.append(student)\n    name_pattern = r'\\b(?:' + '|'.join(re.escape(item) for item\
          \ in names) + r')\\b'\n    pattern = re.compile(\n        r'\\[[^\\]\\n]{1,200}\\]|https?://[^\\s)]+|' + name_pattern\
          \ +\n        r'|\\b(?:IELTS|TOEFL|PET|KET|CEFR|[ABC][12])\\b|\\d+(?:[.,:/-]\\d+)*(?:%)?', re.I\n    )\n    def letters(number):\n\
          \        label = ''\n        while True:\n            label = chr(65 + number % 26) + label\n            number\
          \ = number // 26 - 1\n            if number < 0:\n                return label\n    def protect(match):\n      \
          \  token = 'ZXQ' + letters(len(protected)) + 'QXZ'\n        while any(token in value for value in content.values()):\n\
          \            token = 'ZXQX' + token + 'XQXZ'\n        protected[token] = match.group(0)\n        return token\n\
          \    for key in ('answer', 'missing_information', 'staff_evidence'):\n        payload[key] = pattern.sub(protect,\
          \ content[key])\n    return {'requires_translation': 'yes' if needs_translation else 'no',\n            'language_code':\
          \ code, 'language_name': name, 'content': content,\n            'translation_payload': json.dumps(payload, ensure_ascii=False),\n\
          \            'protected_values': json.dumps(protected, ensure_ascii=False)}\n"
