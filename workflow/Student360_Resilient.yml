        code: "import json, re\ndef main(gap: dict, source_texts_json: str) -> dict:\n    names=['student_alias','question','message','missing_information','evidence_status','request_type','sources','evidence_context']\n\
          \    output={key:str(gap.get(key) or '') for key in names}\n    try: docs=json.loads(source_texts_json)\n    except\
          \ (ValueError,TypeError): docs={}\n    query=output['question'].lower()\n    terms=set(re.findall(r'[a-z]+|\\d+',query))-{'what','was','were','is','are','the','for','on','of','a','an','and','to','in','s',output['student_alias'].lower()}\n\
          \    candidates=[]\n    seen=set()\n    for ref,texts in docs.items():\n        for text in texts:\n           \
          \ paragraphs=[p.strip() for p in re.split(r'\\n\\s*\\n|\\n',text) if p.strip()]\n            for i,p in enumerate(paragraphs):\n\
          \                if p in seen: continue\n                seen.add(p)\n                words=set(re.findall(r'[a-z]+|\\\
          d+',p.lower()))\n                score=len(terms & words)\n                if 'illegible' in p.lower(): score+=5\n\
          \                if 'official' in p.lower() and ('score' in query or 'result' in query): score+=2\n            \
          \    if score:\n                    block=p[:950]\n                    candidates.append((score,ref,block))\n  \
          \  candidates.sort(key=lambda item:-item[0])\n    output['review_excerpt']='\\n\\n'.join(ref+'\\n'+text for _,ref,text\
          \ in candidates[:3])[:3000]\n    if not output['review_excerpt']: output['review_excerpt']='No relevant readable\
          \ extract is available. Please supply the school record below.'\n    return output\n"
