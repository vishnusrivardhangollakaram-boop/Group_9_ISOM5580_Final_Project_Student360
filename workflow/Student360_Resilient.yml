          \        {'report':'學生進度報告','answer':'您的答覆','plan':'教師批准的計劃','translated_plan':'教師批准的計劃（中文翻譯）',\n         'missing':'仍需補充的資訊','details':'報告詳情','student':'學生','outcome':'處理結果','evidence':'支持資訊',\n\
          \         'review':'審核狀態','language':'報告語言','changes':'審核調整','sources':'參考來源','checked':'已查看的記錄',\n         'reference':'學校記錄編號','unknown':'請確認學生姓名','unresolved':'這些記錄尚不能確認所詢問資訊。',\n\
