      data:
        type: code
        title: Check the translated report
        desc: Restore protected student names, numbers and source references. Show the original with a clear notice if translation
          fails validation.
        selected: false
        code: "\nimport json,re,unicodedata\ndef read_model_object(raw):\n    text=str(raw or '').strip().lstrip('\\ufeff')\n\
          \    if text in {'__RECORD_CHECK_UNAVAILABLE__','__TRANSLATION_UNAVAILABLE__',''}:\n        raise ValueError('model_unavailable')\n\
          \    text=re.sub(r'<think>.*?</think>','',text,flags=re.I|re.S).strip()\n    if re.search(r'</?think>',text,re.I):\
          \ raise ValueError('incomplete_model_response')\n    if text.startswith('```'):\n        text=re.sub(r'^```(?:json)?\\\
          s*','',text,flags=re.I)\n        text=re.sub(r'\\s*```\\s*$','',text)\n    try:\n        value=json.loads(text)\n\
          \    except (ValueError,TypeError):\n        start=text.find('{')\n        if start<0: raise ValueError('invalid_json')\n\
          \        try: value,end=json.JSONDecoder().raw_decode(text[start:])\n        except ValueError: raise ValueError('invalid_json')\n\
          \        # Accept a single wrapped JSON object, never select between conflicting objects.\n        if re.search(r'[\\\
          {\\[]',text[start+end:]): raise ValueError('multiple_json_objects')\n    if isinstance(value,str):\n        try:\
          \ value=json.loads(value)\n        except ValueError: raise ValueError('invalid_json')\n    if not isinstance(value,dict):\
          \ raise ValueError('model_object_required')\n    return value\ndef normalize_text(value):\n    value=unicodedata.normalize('NFKC',str(value))\n\
          \    value=value.translate(str.maketrans({'’':\"'\",'‘':\"'\",'“':'\"','”':'\"','–':'-','—':'-','−':'-'}))\n   \
          \ return re.sub(r'\\s+',' ',value).strip()\ndef canonical_reference(value,allowed):\n    if not isinstance(value,str):\
          \ raise ValueError('unknown_source_reference')\n    key=normalize_text(value).strip('[]').strip().casefold()\n \
          \   matches=[ref for ref in allowed if normalize_text(ref).strip('[]').strip().casefold()==key]\n    if len(matches)!=1:\
          \ raise ValueError('unknown_source_reference')\n    return matches[0]\ndef parent_failure(code):\n    if code=='model_unavailable':\n\
          \        return 'The school record was received, but the answer service did not complete its check. Please retry\
          \ the school review.'\n    if code in {'invalid_json','multiple_json_objects','model_object_required','incomplete_model_response','invalid_model_fields'}:\n\
          \        return 'The school record was received, but the answer could not be read reliably. Please retry the school\
          \ review.'\n    if code in {'unknown_source_reference','quote_not_in_record','unknown_answer_reference'}:\n    \
          \    return 'A supporting statement could not be matched to the referenced record. The school needs to check the\
          \ record extract and reference.'\n    if code=='verified_source_not_used':\n        return 'The answer check did\
          \ not use the school-verified record to establish the requested fact. The school needs to review the supporting\
          \ record.'\n    return 'The submitted record has not yet established all the requested information. The school needs\
          \ to complete its check before confirming the answer.'\n\nimport json\nimport re\nfrom collections import Counter\n\
          \ndef main(raw: str, translation_payload: str, protected_values: str, content: dict, language_code: str) -> dict:\n\
          \    original = dict(content)\n    def fallback():\n        original['translation_status'] = 'unavailable'\n   \
          \     original['notice'] = (\n            '暂时无法完成可靠的中文翻译，以下显示原文。请稍后重试；原有审核结果不变。'\n            if language_code ==\
          \ 'zh-Hans' else\n            '暫時無法完成可靠的中文翻譯，以下顯示原文。請稍後重試；原有審核結果不變。'\n        )\n        return {'content': original}\n\
          \    try:\n        source = json.loads(translation_payload)\n        protected = json.loads(protected_values)\n\
          \        translated = read_model_object(raw)\n        keys = {'answer', 'missing_information', 'staff_evidence'}\n\
          \        if not isinstance(translated, dict) or set(translated) != keys:\n            return fallback()\n      \
          \  token_pattern = r'ZXQ[A-Z]+?QXZ'\n        for key in keys:\n            value = translated[key]\n           \
          \ if not isinstance(value, str) or (bool(source[key].strip()) != bool(value.strip())):\n                return fallback()\n\
          \            if Counter(re.findall(token_pattern, source[key])) != Counter(re.findall(token_pattern, value)):\n\
          \                return fallback()\n            if re.search(r'\\d', value):\n                return fallback()\n\
          \            # Nonempty English prose must have actually been translated.\n            unprotected = re.sub(token_pattern,\
          \ '', source[key])\n            if re.search(r'[A-Za-z]{2}', unprotected) and not re.search(r'[\\u3400-\\u9fff]',\
          \ value):\n                return fallback()\n            for token, literal in protected.items():\n           \
          \     value = value.replace(token, literal)\n            translated[key] = value\n        translated['translation_status']\
          \ = 'translated'\n        translated['notice'] = ''\n        return {'content': translated}\n    except (ValueError,\
          \ TypeError, KeyError):\n        return fallback()\n"
        code_language: python3
